<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Document</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="preconnect" href="https://tile.openstreetmap.org">
    <style>#map { height: 100%; width: 100%; background: rgb(224, 224, 224); position: absolute;top: 0px; left: 0px; z-index: 1;}</style>
</head>
<body>
    <main>
        <!-- FORM -->
        <section id="select_by_stop_id">
            <div class="box_form">
                <p>
                    Encuentra dónde está el autobús introduciendo el número de la parada en la que te encuentras.
                </p>
                <a class="toggle_help_finding_stop_id">
                    ¿Cómo encuentro el número de mi parada?
                </a>
                <div id="help_finding_stop_id">
                    <p>
                        El número suele estar indicado en la parada, tal y como se muestra en la imagen.
                    </p>
                    <img src="img/find_stop_id.png" alt="ejemplo número de parada">
                    <button>Cerrar imagen</button>
                </div>
                <label for="stop_id_input">
                    Número de parada:
                </label>
                <input 
                    type="text"
                    inputmode="numeric"
                    id="stop_id_input"
                    placeholder="Introducir aqui"
                    required
                >
                <button id="load_stop_btn">Seleccionar</button>
                <div id="status"></div>
            </div>
            <div id="collapse_arrow"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M297.4 201.4C309.9 188.9 330.2 188.9 342.7 201.4L502.7 361.4C515.2 373.9 515.2 394.2 502.7 406.7C490.2 419.2 469.9 419.2 457.4 406.7L320 269.3L182.6 406.6C170.1 419.1 149.8 419.1 137.3 406.6C124.8 394.1 124.8 373.8 137.3 361.3L297.3 201.3z"/></svg></div>
        </section>
        <!-- MAP -->
        <div id="map">
            Cargando el mapa...
        </div>
    </main>

    <!-- Move form up or down -->
    <script src="js/up_down_form.js"></script>
    <!-- Toggle image of where is the bus stop id -->
    <script src="js/toggle_image.js"></script>
    <!-- VARS -->
    <script src="js/everything_else.js"></script>
</body>
</html>
