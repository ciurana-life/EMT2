[project]
name = "emt2"
version = "0.1.0"
description = ""
authors = [
    {name = "Victor Ciurana",email = "admin@victorciurana.com"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "django (>=6.0.2,<7.0.0)",
    "black (>=26.1.0,<27.0.0)",
    "isort (>=8.0.0,<9.0.0)",
    "requests (>=2.32.5,<3.0.0)",
    "requests-cache (>=1.3.0,<2.0.0)",
    "ipython (>=9.10.0,<10.0.0)"
]

[tool.poetry]
packages = [{include = "emt2", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
